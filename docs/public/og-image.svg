<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Card Glow -->
    <radialGradient id="glowGrad" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowGrad)" />

  <!-- Outer Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="2" />

  <!-- Logo Group -->
  <g transform="translate(100, 165) scale(3)">
    <!-- Shield -->
    <path d="M50 10 L82 22 C82 55 50 88 50 88 C50 88 18 55 18 22 Z" fill="url(#shieldGrad)" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Leaf -->
    <path d="M50 28 C65 28 72 45 70 60 C58 66 42 64 36 50 C32 40 40 30 50 28 Z" fill="url(#leafGrad)"/>
    <path d="M42 58 Q 50 45 62 36" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Text Group -->
  <g transform="translate(420, 220)">
    <!-- Brand Title -->
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Leaves Guardian</text>
    
    <!-- Subtitle -->
    <text x="0" y="60" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#34d399">Baileys Wrapper &amp; Reliability Layer for WhatsApp Bots</text>

    <!-- Description -->
    <text x="0" y="120" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Message Normalization • Priority Traffic Pacing • Socket Watchdog</text>
    <text x="0" y="155" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Memory Guard • Privacy Scrubber • 12 Fluent Message Builders</text>

    <!-- Badge -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="160" height="38" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
      <text x="80" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle">v0.2.0 • Node.js</text>
    </g>
  </g>
</svg>
